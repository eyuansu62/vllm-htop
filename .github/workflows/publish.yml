name: Publish to PyPI

# Triggered when a version tag is pushed (e.g. `git tag v0.1.1 && git push --tags`).
# Builds the sdist + wheel, verifies the tag matches __version__, publishes to PyPI
# via Trusted Publishing (OIDC — no API token stored in repo secrets), and creates
# a GitHub Release with the built artifacts attached.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import vllm_htop; print(vllm_htop.__version__)')"
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG does not match vllm_htop.__version__ ($PKG)"
            exit 1
          fi

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Maps to a GitHub "environment" named `pypi` — create this once in repo
    # settings and link it to PyPI Trusted Publishing.
    environment:
      name: pypi
      url: https://pypi.org/p/vllm-htop
    permissions:
      # Required for OIDC token used by Trusted Publishing.
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
